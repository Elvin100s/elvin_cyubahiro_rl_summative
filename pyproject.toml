[project]
name = "elvin-cyubahiro-rl-summative"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.162.5",
    "gymnasium>=1.4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pygame>=2.6.1",
    "tabulate>=0.10.0",
    "tensordict>=0.15.6",
    "torch>=2.14.1",
    "torchrl>=0.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
